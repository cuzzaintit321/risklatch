{% extends 'base.html' %}{% block body %}<div class="panel" style="max-width:650px;margin:auto"><h1>Document submission</h1><p>Submit compliance documents for {{v.name}}. All documents are reviewed by the requesting organization.</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{csrf()}}"><label>Document type</label><select name="kind"><option>COI</option><option>W-9</option><option>Lien waiver</option><option>Endorsement</option><option>License</option></select><label>PDF document (up to 15 MB)</label><input type="file" name="file" accept="application/pdf" required><p><button>Submit document</button></p></form></div>{% endblock %}
